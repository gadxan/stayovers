/* ---------- sign-in ---------- */
const authMsg = (html, kind = "errbox") => { $("#auth-msg").innerHTML = html ? `<div class="${kind}">${html}</div>` : ""; };
const redirectTo = () => location.origin + location.pathname;
function showAuth(status){
  $("#app").hidden = true; $("#auth").hidden = false;
  $("#auth-status").textContent = status || "Sign in with the email the owner added for you.";
  $("#login-form").hidden = !sb;
  if (sb) setTimeout(() => $("#login-email").focus(), 30);
}
function showApp(){ $("#auth").hidden = true; $("#app").hidden = false; }
async function login(){
  const email = $("#login-email").value.trim(), password = $("#login-password").value;
  if (!password) return authMsg("Enter your password, or use “Email me a sign-in link”.");
  const btn = $("#login-form button[type=submit]"); btn.disabled = true; authMsg("");
  const {error} = await sb.auth.signInWithPassword({email, password});
  btn.disabled = false;
  if (!error) return;
  if (error.name === "AuthRetryableFetchError" || !error.status) authMsg("Can’t reach the server. Check your internet connection and try again.");
  else authMsg(/confirm/i.test(error.message) ? "Open the invitation email first, then sign in." : "That email and password don’t match. Try again or use “Forgot password?”.");
}
async function authLink(kind){
  const email = $("#login-email").value.trim();
  if (!/^\S+@\S+\.\S+$/.test(email)) return authMsg("Type your email address first.");
  authMsg("");
  const {error} = kind === "magic"
    ? await sb.auth.signInWithOtp({email, options:{shouldCreateUser:false, emailRedirectTo: redirectTo()}})
    : await sb.auth.resetPasswordForEmail(email, {redirectTo: redirectTo()});
  if (error) return authMsg(/rate|seconds/i.test(error.message) ? "Too many emails just now. Wait a minute and try again." : "Couldn’t send the email. Check the address; only people the owner added can sign in.");
  authMsg(`Check ${esc(email)} for an email from Stayover Mikocheni and tap the link in it. It can take a minute; check spam too.`, "okbox");
}
async function savePassword(f){
  const a = $("#pw1").value, b = $("#pw2").value;
  if (a.length < 8) return formError("Use at least 8 characters.");
  if (a !== b) return formError("The two passwords don’t match.");
  const btn = f.querySelector("button[type=submit]"); btn.disabled = true;
  const {error} = await sb.auth.updateUser({password: a});
  btn.disabled = false;
  if (error) return formError(/different|same/i.test(error.message) ? "Choose a password different from your old one." : "Couldn’t save the password. Try again.");
  S.needPw = false; closeSheet(true); toast("Password saved");
}

let starting = null, channel = null;
async function start(user){
  if (S.user && S.user.id === user.id) return;
  if (starting) return starting;
  starting = (async () => {
    S.user = user;
    const {data: p, error} = await sb.from("profiles").select("role,full_name").eq("id", user.id).maybeSingle();
    if (error || !p){ S.user = null; showAuth("This login isn’t on the Stayover team yet. Ask the owner to add you."); await sb.auth.signOut(); return; }
    S.role = p.role; S.name = p.full_name || "";
    S.demo = false; S.loaded = false;
    showApp(); render();
    await Promise.all(COLLS.map(t => fetchAll(t).then(rows => { live[t] = rows; }).catch(e => console.warn("load " + t, e))));
    S.loaded = true; render();
    let pending = {};
    channel = sb.channel("stayover-live");
    for (const t of COLLS) channel.on("postgres_changes", {event:"*", schema:"public", table:t}, () => { clearTimeout(pending[t]); pending[t] = setTimeout(() => refresh(t), 400); });
    channel.subscribe();
    if (S.needPw) pwSheet(true);
  })();
  try { await starting; } finally { starting = null; }
}
function signedOut(){
  if (channel && sb) sb.removeChannel(channel); channel = null;
  S.user = null; S.role = null; S.loaded = false; closeSheet(true);
  for (const t of COLLS) live[t] = [];
  for (const k in urlCache) delete urlCache[k];
  if (!S.demo) showAuth("You’re signed out.");
}

/* ---------- boot ---------- */
(function initHash(){
  const h = location.hash;
  if (/type=(invite|recovery|signup)/.test(h)) S.needPw = /type=(invite|recovery)/.test(h);
  const v = h.slice(1); if (VIEWS.includes(v)) S.view = v;
})();
(function boot(){
  const cfg = window.STAYOVER_CONFIG || {};
  if (!window.supabase || !cfg.supabaseUrl || /YOUR-/.test(cfg.supabaseUrl + cfg.supabaseAnonKey)){
    return showAuth(window.supabase ? "Not connected yet: add your Supabase address and key to config.js (see SETUP.md). You can preview with sample data meanwhile." : "Couldn’t load the sign-in service. Check your internet connection and reload.");
  }
  sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
  sb.auth.onAuthStateChange((event, session) => {
    // run outside the callback: Supabase recommends not awaiting its own calls in here
    setTimeout(() => {
      if (event === "PASSWORD_RECOVERY") S.needPw = true;
      if (event === "SIGNED_OUT") return signedOut();
      if (session && session.user) start(session.user).then(() => { if (S.needPw && S.user && !$("#pw-form")) pwSheet(true); });
      else if (event === "INITIAL_SESSION") showAuth();
    }, 0);
  });
})();
})();
